name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc
      - run: npm run test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            coverage/
            test-results/
          if-no-files-found: ignore

  integration-test:
    name: Integration Tests (${{ matrix.os }} / ${{ matrix.browser }})
    needs: unit-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        browser: [chrome, edge, firefox]
        exclude:
          # Edge is only on Windows
          - os: ubuntu-latest
            browser: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc

      # Install Firefox browser when needed (geckodriver is handled
      # by selenium-webdriver's built-in Selenium Manager).
      - name: Install Firefox (Linux)
        if: runner.os == 'Linux' && matrix.browser == 'firefox'
        id: firefox-linux
        uses: browser-actions/setup-firefox@v1.7.2
        with:
          firefox-version: latest
      - name: Install Firefox (Windows)
        if: runner.os == 'Windows' && matrix.browser == 'firefox'
        id: firefox-win
        uses: browser-actions/setup-firefox@v1.7.2
        with:
          firefox-version: latest

      - name: Run integration tests
        id: integration-test
        env:
          SE_CLI_E2E: '1'
          SE_CLI_TEST_CHROME: ${{ matrix.browser == 'chrome' && '1' || '' }}
          SE_CLI_TEST_EDGE: ${{ matrix.browser == 'edge' && '1' || '' }}
          SE_CLI_TEST_FIREFOX: ${{ matrix.browser == 'firefox' && '1' || '' }}
          SE_FIREFOX_BINARY: ${{ matrix.browser == 'firefox' && (runner.os == 'Linux' && steps.firefox-linux.outputs.firefox-path || steps.firefox-win.outputs.firefox-path) || '' }}
        run: npx vitest run tests/integration/lifecycle.test.ts

      # Retry integration tests once on failure — browser driver crashes
      # (e.g. Windows chromedriver 0xC0000142) are often transient.
      - name: Retry integration tests on failure
        if: failure() && steps.integration-test.outcome == 'failure'
        env:
          SE_CLI_E2E: '1'
          SE_CLI_TEST_CHROME: ${{ matrix.browser == 'chrome' && '1' || '' }}
          SE_CLI_TEST_EDGE: ${{ matrix.browser == 'edge' && '1' || '' }}
          SE_CLI_TEST_FIREFOX: ${{ matrix.browser == 'firefox' && '1' || '' }}
          SE_FIREFOX_BINARY: ${{ matrix.browser == 'firefox' && (runner.os == 'Linux' && steps.firefox-linux.outputs.firefox-path || steps.firefox-win.outputs.firefox-path) || '' }}
        run: npx vitest run tests/integration/lifecycle.test.ts
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}-${{ matrix.browser }}
          path: .se-cli/
          if-no-files-found: ignore
