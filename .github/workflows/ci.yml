name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc
      - run: npx vitest run tests/unit
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            coverage/
            test-results/
          if-no-files-found: ignore

  integration-test:
    name: Integration Tests (${{ matrix.os }} / ${{ matrix.browser }})
    needs: unit-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        browser: [chrome, edge, firefox]
        exclude:
          # Edge is only on Windows
          - os: ubuntu-latest
            browser: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc

      # Install Firefox browser when needed.
      # Selenium Manager (bundled with selenium-webdriver 4.25+) handles
      # driver downloads automatically — no manual geckodriver install.
      - name: Install Firefox (Linux)
        if: runner.os == 'Linux' && matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@latest
        with:
          firefox-version: latest
      - name: Install Firefox (Windows)
        if: runner.os == 'Windows' && matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@latest
        with:
          firefox-version: latest

      # Chrome and Edge are pre-installed on GitHub Actions runners.
      # Selenium Manager auto-downloads chromedriver and msedgedriver.

      - name: Verify browser availability
        shell: bash
        run: |
          echo "Browser: ${{ matrix.browser }}"
          if [ "${{ matrix.browser }}" = "firefox" ]; then
            firefox --version || echo "Firefox not found in PATH"
          elif [ "${{ matrix.browser }}" = "chrome" ]; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              google-chrome --version || echo "Chrome not found"
            else
              echo "Chrome should be pre-installed on $RUNNER_OS"
            fi
          elif [ "${{ matrix.browser }}" = "edge" ]; then
            echo "Edge should be pre-installed on Windows"
          fi

      - name: Run integration tests
        env:
          SE_CLI_E2E: '1'
          SE_CLI_TEST_${{ matrix.browser == 'chrome' && 'CHROME' || matrix.browser == 'edge' && 'EDGE' || 'FIREFOX' }}: '1'
        run: npx vitest run tests/integration/lifecycle.test.ts
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}-${{ matrix.browser }}
          path: .se-cli/
          if-no-files-found: ignore
