name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc
      - run: npx vitest run tests/unit
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            coverage/
            test-results/
          if-no-files-found: ignore

  integration-test:
    name: Integration Tests (${{ matrix.os }} / ${{ matrix.browser }})
    needs: unit-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        browser: [chrome, edge, firefox]
        exclude:
          # Edge is only on Windows
          - os: ubuntu-latest
            browser: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc
      - name: Install Firefox driver (Linux)
        if: runner.os == 'Linux' && matrix.browser == 'firefox'
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox geckodriver
          which firefox
          which geckodriver
      - name: Install Firefox driver (Windows)
        if: runner.os == 'Windows' && matrix.browser == 'firefox'
        run: |
          choco install -y firefox geckodriver
          where firefox
          where geckodriver
      - name: Run integration tests
        env:
          SE_CLI_E2E: '1'
          SE_CLI_TEST_${{ matrix.browser == 'chrome' && 'CHROME' || matrix.browser == 'edge' && 'EDGE' || 'FIREFOX' }}: '1'
        run: npx vitest run tests/integration/lifecycle.test.ts
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}-${{ matrix.browser }}
          path: .se-cli/
          if-no-files-found: ignore
