name: Dependency Update

on:
  schedule:
    # Run daily at 08:00 UTC (16:00 Beijing time)
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update-selenium-webdriver:
    name: Update selenium-webdriver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check latest version
        id: check
        run: |
          LATEST=$(npm view selenium-webdriver version)
          CURRENT=$(node -p "require('./package.json').dependencies['selenium-webdriver'].replace(/[\^~]/, '')")
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "Latest on npm: $LATEST"
          echo "Current in package.json: $CURRENT"
          if [ "$LATEST" = "$CURRENT" ]; then
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "Already up to date."
          else
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "Update available: $CURRENT -> $LATEST"
          fi

      - name: Update dependency
        if: steps.check.outputs.updated == 'true'
        run: |
          npm install selenium-webdriver@^${{ steps.check.outputs.latest }}
          npm run build

      - name: Run unit tests
        if: steps.check.outputs.updated == 'true'
        run: npx vitest run tests/unit

      - name: Push update branch
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="deps/selenium-webdriver-${{ steps.check.outputs.latest }}"
          git checkout -B "$BRANCH"
          git add package.json package-lock.json
          git commit -m "chore(deps): bump selenium-webdriver to ${{ steps.check.outputs.latest }}

          Update selenium-webdriver from ${{ steps.check.outputs.current }} to ${{ steps.check.outputs.latest }}.

          Automated by the Dependency Update workflow."
          # Force push to overwrite any stale branch from a previous run.
          git push --force origin "$BRANCH"

      - name: Create issue for manual PR
        if: steps.check.outputs.updated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `chore(deps): bump selenium-webdriver to ${{ steps.check.outputs.latest }}`;

            // Check if an issue with the same title already exists
            // to avoid duplicates across repeated workflow runs.
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies',
              per_page: 100,
            });

            const existing = issues.find(i => i.title === title);
            if (existing) {
              console.log(`Issue already exists: ${existing.html_url}`);
              return;
            }

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: [
                `## What`,
                '',
                `Bumps [selenium-webdriver](https://www.npmjs.com/package/selenium-webdriver) from \`${{ steps.check.outputs.current }}\` to \`${{ steps.check.outputs.latest }}\`.`,
                '',
                `## Verification`,
                '',
                '- [x] `npm run build` passes',
                '- [x] `npx vitest run tests/unit` passes',
                '',
                `## Action required`,
                '',
                `A branch \`deps/selenium-webdriver-${{ steps.check.outputs.latest }}\` has been pushed.`,
                `Create a PR from that branch to merge the update:`,
                `[Create PR](https://github.com/${context.repo.owner}/${context.repo.repo}/compare/main...deps/selenium-webdriver-${{ steps.check.outputs.latest }}?expand=1)`,
                '',
                '---',
                'This issue was created automatically by the `Dependency Update` GitHub Actions workflow.',
              ].join('\n'),
              labels: ['dependencies', 'automated'],
            });
            console.log(`Created issue #${issue.number}: ${issue.html_url}`);
