name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. v0.1.0) — see Releases page for available tags'
        required: true
        type: string
      dry-run:
        description: 'Dry run — pack only, skip actual publish'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    name: Publish @browsers-cli/se-cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for npm provenance
    steps:
      - name: Resolve release tag
        id: release
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing @browsers-cli/se-cli@$VERSION from release $TAG"

      - name: Verify release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view '${{ steps.release.outputs.tag }}' --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "::error::Release '${{ steps.release.outputs.tag }}' not found. Check the Releases page for available tags."
            echo "::notice::Available releases:"
            gh release list --repo '${{ github.repository }}' --limit 20 || true
            exit 1
          fi
          echo "Release verified:"
          gh release view '${{ steps.release.outputs.tag }}' --repo '${{ github.repository }}' \
            --json tagName,name,createdAt,isDraft,isPrerelease \
            --jq '. | "  tag: \(.tagName)\n  name: \(.name)\n  created: \(.createdAt)\n  prerelease: \(.isPrerelease)"'

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Set package version
        run: |
          npm version '${{ steps.release.outputs.version }}' --no-git-tag-version --allow-same-version

      - name: Dry run — preview package contents
        if: ${{ inputs.dry-run == true }}
        run: npm pack --dry-run

      - name: Publish to npm
        if: ${{ inputs.dry-run != true }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
