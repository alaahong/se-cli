name: Create Release

# This workflow creates a GitHub Release (draft by default), which then
# triggers publish.yml → npm publish automatically once published.
#
# The release is published FROM the release/v<x.y.z> branch (never from main):
#   1. Create release/v<x.y.z> from upstream/main, bump the version, open a
#      PR, wait for CI to pass
#   2. Run this workflow (workflow_dispatch) — it checks out the release
#      branch, verifies the tag version, and creates a draft release
#   3. Publish the draft → npm publish (publish.yml)
#   4. Squash-merge the release PR back into main — one clean merge
#
# Two trigger modes:
#   1. Push a version tag:  git tag v0.2.0 && git push origin v0.2.0
#   2. Manual dispatch from the Actions tab (enters a version number,
#      optionally the release branch)
#
# The release is created as a DRAFT by default. Review the draft on the
# Releases page, then click "Publish" to trigger npm publish.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0)'
        required: true
        type: string
      release_branch:
        description: 'Release branch to publish from (e.g. release/v0.10.0). Defaults to release/v<version> — only override when the branch name differs.'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create as draft (recommended — publish manually to trigger npm)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write  # required to create tags and releases

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      # ── Resolve version & tag ──────────────────────────────────────
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"  # e.g. v0.2.0 from tag push
          fi
          # Strip leading 'v' if present
          VERSION="${VERSION#v}"
          TAG="v${VERSION}"
          BRANCH="${{ inputs.release_branch }}"
          if [ -z "$BRANCH" ]; then
            BRANCH="release/v${VERSION}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "─── Release Summary ───"
          echo "  Tag:     $TAG"
          echo "  Version: $VERSION"
          echo "  Branch:  $BRANCH"
          echo "  Source:  ${{ github.event_name }}"

      # ── Checkout code ───────────────────────────────────────────────
      - name: Checkout (tag push)
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog

      - name: Checkout (manual dispatch — from release branch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.ver.outputs.branch }}

      # ── Quality gate ────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & Type Check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx vitest run tests/unit

      # Release gate: run the integration suite against a real browser
      # before cutting the tag. PR CI already runs the full matrix; this
      # step re-verifies the critical user path on the exact commit being
      # released (chrome headless — fast, hermetic, no external services).
      - name: Integration tests (chrome, release gate)
        env:
          SE_CLI_E2E: '1'
          SE_CLI_TEST_CHROME: '1'
        run: npx vitest run tests/integration/lifecycle.test.ts tests/integration/v0.10-remote.test.ts tests/integration/v0.10-grid.test.ts

      # ── Version verification ────────────────────────────────────────
      - name: Verify package version matches release tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::package.json version ($PKG_VERSION) ≠ release version (${{ steps.ver.outputs.version }})"
            echo "::notice::Update package.json: npm version ${{ steps.ver.outputs.version }} --no-git-tag-version"
            exit 1
          fi
          echo "✓ Version verified: $PKG_VERSION"

      # ── Build npm tarball for release assets ────────────────────────
      - name: Set package version and pack
        id: pack
        run: |
          npm version '${{ steps.ver.outputs.version }}' --no-git-tag-version --allow-same-version
          npm pack
          TARBALL=$(ls *.tgz)
          echo "tarball=$TARBALL" >> $GITHUB_OUTPUT
          echo "✓ Packaged: $TARBALL"

      # ── Create GitHub Release ───────────────────────────────────────
      # gh release create creates the tag automatically from --target
      # (the release branch), so manual dispatch needs no separate
      # git-push-tag step — that would only trigger a duplicate
      # tag-push run of this workflow.
      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            ARGS="$ARGS --prerelease"
          fi
          # Default to draft for both tag push and manual dispatch
          # (empty inputs.draft means tag push — also default to draft)
          DRAFT="${{ inputs.draft }}"
          if [ "$DRAFT" != "false" ]; then
            ARGS="$ARGS --draft"
          fi

          # Use --generate-notes for GitHub's auto-generated release notes
          # (includes PR links, new contributors, and full changelog link)
          gh release create '${{ steps.ver.outputs.tag }}' \
            --title "${{ steps.ver.outputs.tag }}" \
            --generate-notes \
            --target '${{ steps.ver.outputs.branch }}' \
            '${{ steps.pack.outputs.tarball }}' \
            $ARGS

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ steps.ver.outputs.tag }}"
          echo "url=$RELEASE_URL" >> $GITHUB_OUTPUT
          echo ""
          echo "✓ Release created: $RELEASE_URL"
          if [ "$DRAFT" != "false" ]; then
            echo "  → Draft created — publish it manually to trigger npm publish"
          else
            echo "  → npm publish workflow will trigger automatically"
          fi

      # ── Job summary ────────────────────────────────────────────────
      - name: Job summary
        if: always()
        run: |
          STATUS="✅ Success"
          if [ "${{ job.status }}" != "success" ]; then
            STATUS="❌ ${{ job.status }}"
          fi

          {
            echo "## Release: ${{ steps.ver.outputs.tag }} — $STATUS"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Tag | \`${{ steps.ver.outputs.tag }}\` |"
            echo "| Version | \`${{ steps.ver.outputs.version }}\` |"
            echo "| Prerelease | \`${{ inputs.prerelease || 'false' }}\` |"
            echo "| Draft | \`${{ inputs.draft || 'true' }}\` |"
            if [ "${{ steps.release.outputs.url }}" != "" ]; then
              echo "| Release URL | [View on GitHub](${{ steps.release.outputs.url }}) |"
            fi
            echo ""
            echo "### Next Steps"
            echo ""
            DRAFT="${{ inputs.draft }}"
            if [ "$DRAFT" != "false" ]; then
              if [ "${{ steps.release.outputs.url }}" != "" ]; then
                echo "1. Review the [draft release](${{ steps.release.outputs.url }})"
              else
                echo "1. Review the draft release on the Releases page"
              fi
              echo "2. Edit release notes if needed"
              echo "3. Click **Publish release** to trigger npm publish"
            else
              echo "1. npm publish workflow triggered automatically"
              echo "2. Check [Actions](https://github.com/${{ github.repository }}/actions) for publish status"
            fi
          } >> $GITHUB_STEP_SUMMARY
