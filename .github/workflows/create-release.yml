name: Create Release

# This workflow creates a GitHub Release, which then triggers
# publish.yml → npm publish automatically.
#
# Two trigger modes:
#   1. Push a version tag (git tag v0.2.0 && git push origin v0.2.0)
#   2. Manual dispatch from the Actions tab (enters a version number)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create as draft (publish manually to trigger npm)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write  # required to create tags and releases

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      # ── Resolve version & tag ──────────────────────────────────────
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"  # e.g. v0.2.0 from tag push
          fi
          # Strip leading 'v' if present
          VERSION="${VERSION#v}"
          TAG="v${VERSION}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "─── Release Summary ───"
          echo "  Tag:     $TAG"
          echo "  Version: $VERSION"
          echo "  Source:  ${{ github.event_name }}"

      # ── Checkout code ───────────────────────────────────────────────
      - name: Checkout (tag push)
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog

      - name: Checkout (manual dispatch — tag from main)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # ── Quality gate ────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & Type Check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx vitest run tests/unit

      # ── Version verification ────────────────────────────────────────
      - name: Verify package version matches release tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::package.json version ($PKG_VERSION) ≠ release version (${{ steps.ver.outputs.version }})"
            echo "::notice::Update package.json: npm version ${{ steps.ver.outputs.version }} --no-git-tag-version"
            exit 1
          fi
          echo "✓ Version verified: $PKG_VERSION"

      # ── Create tag (manual dispatch only) ──────────────────────────
      - name: Create and push tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag '${{ steps.ver.outputs.tag }}' -m "Release ${{ steps.ver.outputs.tag }}"
          git push origin '${{ steps.ver.outputs.tag }}'

      # ── Generate release notes ──────────────────────────────────────
      - name: Generate changelog
        id: changelog
        run: |
          # Find the previous tag for the changelog range
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "Previous release: $PREV_TAG"
            # Get commits between previous tag and HEAD
            COMMITS=$(git log "$PREV_TAG..HEAD" --pretty=format:"- %s" --no-merges)
          else
            echo "No previous tag found — using last 30 commits"
            COMMITS=$(git log --pretty=format:"- %s" --no-merges -30)
          fi

          # Build release notes
          {
            echo "## What's Changed"
            echo ""
            echo "$COMMITS"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ steps.ver.outputs.tag }}"
            fi
          } > release-notes.md

          echo "─── Release Notes ───"
          cat release-notes.md

      # ── Create GitHub Release ───────────────────────────────────────
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            ARGS="$ARGS --prerelease"
          fi
          if [ "${{ inputs.draft }}" = "true" ]; then
            ARGS="$ARGS --draft"
          fi

          gh release create '${{ steps.ver.outputs.tag }}' \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes-file release-notes.md \
            --target main \
            $ARGS

          echo ""
          echo "✓ Release created: https://github.com/${{ github.repository }}/releases/tag/${{ steps.ver.outputs.tag }}"
          if [ "${{ inputs.draft }}" != "true" ]; then
            echo "  → npm publish workflow will trigger automatically"
          else
            echo "  → Draft created — publish it manually to trigger npm publish"
          fi
