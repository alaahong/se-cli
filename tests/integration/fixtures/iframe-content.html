<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IFrame Content</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 1rem auto; padding: 0 1rem; }
    h2 { color: #2563eb; }
    input, button { padding: 0.5rem 1rem; font-size: 1rem; margin: 0.25rem 0; }
    button { background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    #result { margin-top: 1rem; padding: 0.75rem; background: #f0f9ff; border-radius: 4px; min-height: 1.5rem; }
  </style>
</head>
<body>
  <h2>IFrame Content</h2>
  <p>This is content inside an iframe.</p>
  <form id="iframe-form" onsubmit="event.preventDefault(); document.getElementById('result').textContent = 'Submitted: ' + document.getElementById('iframe-input').value;">
    <label for="iframe-input">Name</label>
    <br>
    <input type="text" id="iframe-input" placeholder="Enter your name">
    <br>
    <button type="submit">Submit Inside Iframe</button>
  </form>
  <div id="result"></div>
  <p><a href="#iframe-link">IFrame Link</a></p>
</body>
</html>
