<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Button Test Page</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    h1 { color: #2c3e50; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1.5rem 0; }
    button { padding: 0.5rem 1.5rem; font-size: 1rem; border: none; border-radius: 4px; cursor: pointer; }
    .btn-primary { background: #22C55E; color: white; }
    .btn-primary:hover { background: #16a34a; }
    .btn-secondary { background: #6366f1; color: white; }
    .btn-secondary:hover { background: #4f46e5; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn-outline { background: transparent; border: 2px solid #22C55E; color: #22C55E; }
    .btn-outline:hover { background: #22C55E; color: white; }
    .counter { font-size: 1.5rem; font-weight: bold; color: #22C55E; }
    .result { margin-top: 1rem; padding: 0.75rem; background: #f0f9ff; border-radius: 4px; min-height: 1.5rem; }
    .toggle-box { width: 100px; height: 100px; background: #ddd; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin: 1rem 0; transition: background 0.3s; }
    .toggle-box.active { background: #22C55E; color: white; }
  </style>
</head>
<body>
  <h1>Button Test Page</h1>

  <h2>Counter Buttons</h2>
  <div class="btn-group">
    <button type="button" class="btn-primary" id="increment" onclick="incrementCounter()">Increment +1</button>
    <button type="button" class="btn-danger" id="decrement" onclick="decrementCounter()">Decrement -1</button>
    <button type="button" class="btn-secondary" id="reset" onclick="resetCounter()">Reset</button>
  </div>
  <p>Count: <span class="counter" id="count">0</span></p>

  <h2>Action Buttons</h2>
  <div class="btn-group">
    <button type="button" class="btn-primary" id="show-text" onclick="showText()">Show Text</button>
    <button type="button" class="btn-outline" id="clear-text" onclick="clearText()">Clear Text</button>
    <button type="button" class="btn-secondary" id="toggle-box" onclick="toggleBox()">Toggle Box</button>
  </div>
  <div class="result" id="result" role="status" aria-live="polite">No action yet.</div>
  <div class="toggle-box" id="box">Box</div>

  <h2>Link Buttons</h2>
  <div class="btn-group">
    <a href="example.html" class="btn-primary" style="text-decoration:none; padding: 0.5rem 1.5rem; border-radius: 4px;">Go to Example</a>
    <a href="links.html" class="btn-outline" style="text-decoration:none; padding: 0.5rem 1.5rem; border-radius: 4px; border: 2px solid #22C55E;">Go to Links</a>
  </div>

  <script>
    var count = 0;

    function updateCount() {
      document.getElementById('count').textContent = count;
    }

    function incrementCounter() {
      count++;
      updateCount();
      document.getElementById('result').textContent = 'Incremented to ' + count;
    }

    function decrementCounter() {
      count--;
      updateCount();
      document.getElementById('result').textContent = 'Decremented to ' + count;
    }

    function resetCounter() {
      count = 0;
      updateCount();
      document.getElementById('result').textContent = 'Counter reset to 0';
    }

    function showText() {
      document.getElementById('result').textContent = 'Button clicked at ' + new Date().toLocaleTimeString();
    }

    function clearText() {
      document.getElementById('result').textContent = '';
    }

    function toggleBox() {
      var box = document.getElementById('box');
      box.classList.toggle('active');
      var isActive = box.classList.contains('active');
      box.textContent = isActive ? 'Active!' : 'Box';
      document.getElementById('result').textContent = isActive ? 'Box is now active' : 'Box is now inactive';
    }
  </script>
</body>
</html>
